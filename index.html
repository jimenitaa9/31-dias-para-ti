<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>31 días para ti ❤️</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #9fd9b1, #c7f0d8);
  min-height:100vh;
  display:flex;
  justify-content:center;
}

.container{
  max-width:900px;
  padding:20px;
  text-align:center;
}

h1{
  color:#2f7a4f;
  margin-bottom:5px;
}

.subtitle{
  color:#3d9163;
  font-size:1.1em;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(90px,1fr));
  gap:12px;
  margin-top:25px;
}

.day{
  background:white;
  border-radius:14px;
  padding:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
  font-weight:bold;
  color:#2f7a4f;
}

.locked{
  opacity:0.4;
}

img{
  width:100%;
  border-radius:12px;
  margin-top:8px;
}

p{
  font-size:0.9em;
  margin-top:6px;
}
</style>
</head>

<body>
<div class="container">

  <h1>31 días para ti ❤️</h1>
  <p class="subtitle">
    Cada día se desbloquea una sorpresa especial  
    hasta tu cumpleaños 🎂
  </p>

  <div class="grid" id="grid"></div>

</div>

<script>
const startDate = new Date("2025-12-01"); // CAMBIA LA FECHA SI ES NECESARIO
const today = new Date();
today.setHours(0,0,0,0);

const grid = document.getElementById("grid");

const textos = [
"",
"Mi Alejandrito pequeñito, hoy se honra al niño con la sonrisa más bonita del mundo.",
"Tu sonrisa me cura todo",
"Nuestro primer día juntos 💚",
"Te elegiría en todas mis vidas",
"Eres mi lugar seguro",
"Tu forma de mirarme lo cambia todo",
"Amarte es lo más fácil",
"Gracias por existir",
"Eres magia",
"Mi persona favorita",
"Tu voz es mi paz",
"Me haces creer en el amor",
"Eres mi calma",
"Mi alegría diaria",
"Te quiero infinito",
"Mi niño precioso",
"Tú y yo siempre",
"Gracias por cuidarme",
"Mi corazón es tuyo",
"No me sueltes nunca",
"Todo contigo",
"Eres hogar",
"Mi mejor decisión",
"Tu risa es mi canción favorita",
"Me haces sentir viva",
"Eres mi regalo",
"Mi lugar feliz",
"Gracias por llegar",
"Te elegiría hoy y siempre",
"Feliz cumpleaños amor 🎂"
];

for(let i = 1; i <= 31; i++){
  const div = document.createElement("div");
  div.className = "day";

  const unlockDate = new Date(startDate);
  unlockDate.setDate(startDate.getDate() + i - 1);
  unlockDate.setHours(0,0,0,0);

  if(today < unlockDate){
    div.classList.add("locked");
    div.innerHTML = "🔒<br>Día " + i;
  }
  else if(today.getTime() === unlockDate.getTime()){
    div.innerHTML = "🎁<br>Día " + i;
    div.onclick = () => {
      div.innerHTML = `
        <img src="img/dia${i}.jpg" alt="Día ${i}">
        <p>${textos[i]}</p>
      `;
      div.onclick = null;
    };
  }
  else{
    div.innerHTML = "✔️<br>Día " + i;
    div.style.opacity = "0.6";
  }

  grid.appendChild(div);
}
</script>

</body>
</html>
